<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>alejo-chat</title>
    <style>
      body {
        margin: 0;
        padding: 3rem 1rem;
        background: #04060c;
        color: #e9f0fa;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7f90aa;
      }
      pre {
        padding: 0.75rem;
        overflow-x: auto;
        border: 1px solid rgba(110, 170, 235, 0.16);
        border-radius: 0.5rem;
        font-size: 0.7rem;
        color: #7f90aa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>alejo-chat · banco de pruebas</h1>
      <pre id="loaded">cargando desde el manifest…</pre>
      <alejo-chat></alejo-chat>
    </main>

    <script type="module">
      const base = new URL("../dist/chat/", import.meta.url);
      const manifest = await (await fetch(new URL("manifest.json", base))).json();

      const script = document.createElement("script");
      script.type = "module";
      script.src = new URL(manifest.entry, base).href;
      script.integrity = manifest.integrity;
      script.crossOrigin = "anonymous";
      script.addEventListener("error", () => {
        document.getElementById("loaded").textContent =
          "integridad rechazada: el bundle no coincide con el manifest";
      });

      document.getElementById("loaded").textContent =
        `v${manifest.version} · ${manifest.bytes} bytes · ${manifest.integrity}`;
      document.head.append(script);
    </script>
  </body>
</html>
