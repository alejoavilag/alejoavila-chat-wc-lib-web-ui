name: Deploy widget

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-widget-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  GCP_PROJECT_ID: alejoavila-web
  WIF_PROVIDER: projects/1027646897233/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SERVICE_ACCOUNT: github-deployer@alejoavila-web.iam.gserviceaccount.com

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Report build-time advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the published bundle
        run: |
          if grep -rlE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----' dist/ 2>/dev/null; then
            echo "::error::Sensitive material found in the published bundle"
            exit 1
          fi
          node scripts/verify-manifest.mjs

  deploy:
    name: Deploy to Firebase Hosting
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Publish
        run: npx --yes firebase-tools@latest deploy --only hosting --project ${{ env.GCP_PROJECT_ID }} --non-interactive
